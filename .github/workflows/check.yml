name: fiverr-presence-check

on:
  schedule:
    # every 15 minutes; GitHub may delay cron runs on free accounts
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated Fiverr usernames or profile URLs'
        required: false
        default: 'ali_sagor,kairachel451'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runner egress IP
        run: |
          echo "Egress IP: $(curl -sS -m 15 https://api.ipify.org || echo lookup-failed)"

      - name: Check Fiverr presence
        env:
          TARGETS: ${{ github.event.inputs.targets || 'ali_sagor,kairachel451' }}
        run: |
          printf '%s\n' ${TARGETS//,/ } > targets.txt
          python3 -m fiverr_presence --batch targets.txt --json --no-cache --delay 2 --no-color || true
